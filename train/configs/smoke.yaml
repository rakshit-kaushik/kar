# R3 smoke run (G2, T+7): voice_run1.yaml with a fixed 50 steps. Measures tokens/s that sizes run 1.
model: ${R3_ARTIFACTS}/models/Qwen3-4B-8bit
train: true
fine_tune_type: lora
optimizer: adam
num_layers: -1
lora_parameters:
  rank: 32
  scale: 2.0
  dropout: 0.05
  keys:
    - self_attn.q_proj
    - self_attn.k_proj
    - self_attn.v_proj
    - self_attn.o_proj
    - mlp.gate_proj
    - mlp.up_proj
    - mlp.down_proj
max_seq_length: 2048
batch_size: 1
grad_accumulation_steps: 16
learning_rate: 1.0e-4
grad_checkpoint: true
mask_prompt: true
steps_per_report: 10
val_batches: 96                               # validation examples per eval point (the whole set when smaller)
seed: 0
iters: 50                                     # fixed: 50 micro-steps (batch 1) = 3 optimizer updates + remainder
steps_per_eval: 25                            # validation at step 25 and 50
save_every: 25                                # midpoint checkpoint + final adapters.safetensors
r3:
  task: voice
  model_prefix: r3-voice
  epochs: 1
  schedule: cosine_decay
  warmup_ratio: 0.03
  clip_grad_norm: 1.0
  eval_points: [0.5, 1.0]
  enable_thinking: false
  packing: false
  quantize: {bits: 8, group_size: 64}
  window_minutes: 10
  safety_factor: 0.85
